<!DOCTYPE html>
<!-- Shown for any address on the site that doesn't exist (an old link, a typo): a way back to the
     downloads, instead of GitHub's bare "404" page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics Playground: page not found</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="/physics-playground/images/favicon.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1020; color: #e8ebf7;
           font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 22px; }
    h1 { font-size: 2rem; margin: 18px 0 8px; }
    p { color: #a4abc9; margin: 0 0 22px; }
    a.button { display: inline-block; background: #ffb347; color: #2a1800; font-weight: 700; padding: 13px 26px; border-radius: 12px; text-decoration: none; }
    img { width: 88px; height: 88px; border-radius: 20px; }
  </style>
</head>
<body>
  <div>
    <img src="/physics-playground/images/icon.png" alt="">
    <h1>That page isn't here</h1>
    <p>The link may be old. The game and its downloads are on the front page.</p>
    <a class="button" href="/physics-playground/">Go to Physics Playground</a>
  </div>
</body>
</html>
